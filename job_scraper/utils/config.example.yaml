# Copy this file to config.yaml and fill in your real credentials.
# config.yaml is gitignored and will never be committed.
#
# Gmail setup:
#   - Enable 2FA on your Google account
#   - Generate an App Password at: https://myaccount.google.com/apppasswords
#   - Use that App Password as the value for 'password' below

email:
  sender: "your-sender@gmail.com"
  password: "your-gmail-app-password"
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  recipient: "your-recipient@gmail.com"
